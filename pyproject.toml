[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proxysim"
version = "0.1.0"
description = "Multi-backend proxy-circuit simulator (tensor-network / statevector / stabilizer) with timing + bitstring distributions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aswath Suryanarayanan" }]
keywords = ["quantum", "benchmarking", "tensor-networks", "stabilizer", "clifford", "quimb", "qiskit", "stim"]

# Core deps -- a plain `pip install -e .` gives a fully working install,
# including the visualization (qiskit/quimb drawing + matplotlib).
dependencies = [
    "numpy",
    "scipy",
    "quimb>=1.10",
    "qiskit>=1.2",
    "stim>=1.13",
    "matplotlib",
    "networkx",
    "pylatexenc",   # required by qiskit's matplotlib circuit drawer
    "pillow",
]

[project.optional-dependencies]
# Better/faster quimb contraction-path search.
fast = ["kahypar", "optuna", "cotengra"]
# Pauli-propagation wrapper around PauliPropagation.jl (boots Julia via juliacall).
# After install, run once:
#   python -c "from proxysim.pauliprop import ensure_installed; ensure_installed()"
pauliprop = ["juliacall"]
# GPU acceleration (CUDA 12.x). Platform-specific; install manually as needed.
# gpu = ["cupy-cuda12x", "qiskit-aer-gpu", "cuquantum-python"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/USERNAME/proxysim"

[tool.setuptools.packages.find]
include = ["proxysim*"]
